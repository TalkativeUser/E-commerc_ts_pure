<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link rel="stylesheet" href="../output.css">
</head>
<body>
    <app-header></app-header>
    <app-drawer></app-drawer>
    <app-state></app-state>
 
    <main class="min-h-screen">
  <div class="container mx-auto px-4 py-10">
    <h1 class="text-3xl font-semibold text-gray-800 mb-8">
      Your Cart
    </h1>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Cart Items -->
      <section id="cart-products" class="lg:col-span-2 space-y-6">
     

        <!-- Item -->
        <div class="flex gap-6 bg-white rounded-xl shadow-sm p-5">
          <img
            src="../../public/products/david-svihovec-LEtrhrME07g-unsplash.jpg"
            alt="product"
            class="w-28 h-28 rounded-lg object-cover"
          />

          <div class="flex-1 flex flex-col justify-between">
            <h2 class="text-lg font-medium text-gray-800">
              Desk Lamp
            </h2>

            <div class="flex items-center justify-between mt-6">
              <div class="flex items-center gap-3 bg-gray-100 rounded-lg px-3 py-1">
                <button>−</button>
                <span>2</span>
                <button>+</button>
              </div>

              <span class="text-lg font-semibold">$80</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Summary -->
      <aside class="bg-white rounded-2xl shadow-md p-6 h-fit">
        <h2 class="text-xl font-semibold text-gray-800 mb-6">
          Order Summary
        </h2>

        <div class="space-y-4 text-sm text-gray-600">
          <div class="flex justify-between">
            <span>Subtotal</span>
            <span>$200</span>
          </div>

          <div class="flex justify-between">
            <span>Shipping</span>
            <span class="text-green-600">Free</span>
          </div>

          <div class="flex justify-between font-semibold text-base text-gray-800 pt-4 border-t">
            <span>Total</span>
            <span>$200</span>
          </div>
        </div>

        <button
          class="mt-8 w-full bg-indigo-600 text-white py-3 rounded-xl font-medium
                 hover:bg-indigo-700 transition"
        >
          Proceed to Checkout
        </button>
      </aside>
    </div>
  </div>
</main>


  
    
    <script type="module" src="../../dist/scripts/cart.js" ></script>
</body>
</html>
