<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="../../src/output.css">
</head>

<body>
      <wraper-pages>


            <app-header></app-header>
            <app-categories></app-categories>
            <app-drawer></app-drawer>
            <app-state></app-state>

    <section class=" flex items-center justify-center mt-5 p-4">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8">

            <!-- Title -->
            <div class="text-center mb-5">
                <h2 class="text-3xl font-bold text-gray-800">Create Account</h2>
            </div>

            <!-- Form -->
            <form id="signup-form" class="space-y-4" data-form="signup">

                <!-- Full Name -->
                <div>
                    <input type="text" placeholder="Enter your full name"
                        class="w-full px-4 py-2 border border-[#e5dada99] rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition" />
                </div>

                <!-- Email -->
                <div>
                    <input type="email" placeholder="Enter your email"
                        class="w-full px-4 py-2 border border-[#e5dada99] rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition" />
                </div>

                <!-- Password -->
                <div>
                    <input type="password" placeholder="Create a password"
                        class="w-full px-4 py-2 border border-[#e5dada99] rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition" />
                </div>

                <!-- Confirm Password -->
                <div>
                    <input type="password" placeholder="Confirm your password"
                        class="w-full px-4 py-2 border border-[#e5dada99] rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition" />
                </div>

                <!-- Button -->
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium
               hover:bg-indigo-700 active:scale-95 transition duration-200">
                    Sign Up
                </button>

            </form>

            <!-- Login Redirect -->
            <p class="text-center text-sm text-gray-500 mt-6">
                Already have an account?
                <a href="#" class="text-indigo-600 hover:underline">Login</a>
            </p>

        </div>
    </section>

      </wraper-pages>
<script type="module" src="../../dist/scripts/signUp.js" ></script>

</body>

</html>
