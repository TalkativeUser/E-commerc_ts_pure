<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
<link rel="stylesheet" href="../../src/output.css">
</head>
<body>
 <section  class="min-h-screen flex items-center justify-center p-4" >

     <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8">
   
       <!-- Title -->
       <div class="text-center mb-8">
         <h2 class="text-3xl font-bold text-gray-800">Welcome Back</h2>
         <p class="text-gray-500 text-sm mt-2">Login to your account</p>
       </div>
   
       <!-- Form -->
       <form class="space-y-5">
   
         <!-- Email -->
         <div>
           <input
             type="email"
             placeholder="Enter your email"
             class="w-full px-4 py-2 border border-[#e5dada99]  rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition"
           />
         </div>
   
         <!-- Password -->
         <div>
           <input
             type="password"
             placeholder="Enter your password"
             class="w-full px-4 py-2 border border-[#e5dada99]  rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition"
           />
         </div>
   
    
         <!-- Button -->
         <button
           type="submit"
           class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium
                  hover:bg-indigo-700 active:scale-95 transition duration-200"
         >
           Login
         </button>
   
       </form>
       <!-- Register -->
       <p class="text-center text-sm text-gray-500 mt-6">
         Don't have an account?
         <a href="#" class="text-indigo-600 hover:underline">Sign up</a>
       </p>
   
     </div>
 </section>

</body>
</html>
