<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e-commerce</title>
  <link href="./src/output.css" rel="stylesheet">
</head>
<!-- npx tailwindcss -i ./src/index.css -o ./src/output.css --watch -->

<!-- issues :
  1- ! symbol 
  2- tailwind.config.js 
  3- skip or avoid the padding end  of parent when happen overflow but resolved with container section
  4- svg with fetch navbar.html
  5- delay in zoom image without any reason
-->

<body>
  <!-- Home page -->
  <section class="home flex justify-center bg-[#EFF1F5] min-h-screen ">
    <div class="container   ">

       <app-header></app-header>
       <app-categories></app-categories>
       <app-drawer></app-drawer>
   <app-state></app-state>


      <div class="heroSection">
        <h2 class="uppercase mb-4! mt-14! text-center font-bold text-2xl text-[#484E68]  ">new released</h2>
        <div class=" px-10 sm:px-16 ">
          <div class="relative ">
            <div class="carousel overflow-hidden ">

              <!-- -translate-x-[25%]  -->
              <div class=" flex innerCarousel translate-0 select-none cursor-grab active:cursor-grabbing  ">

                <div class="slide p-3! w-1/2 aspect-video  shrink-0  ">
                  <img src="./public/products//alexander-andrews-BX4Q0gojWAs-unsplash.jpg"
                    class=" select-none pointer-events-none w-full h-full object-cover rounded-lg " alt="">
                </div>
                <div class="slide p-3! w-1/2 aspect-video  shrink-0  ">
                  <img src="./public/products/ali-bakhtiari-7ic3yF64FS8-unsplash.jpg"
                    class=" select-none pointer-events-none w-full h-full object-cover rounded-lg " alt="">
                </div>
                <div class="slide p-3! w-1/2 aspect-video  shrink-0  ">
                  <img src="./public/products/charlesdeluvio-1-nx1QR5dTE-unsplash.jpg"
                    class=" select-none pointer-events-none w-full h-full object-cover rounded-lg " alt="">
                </div>
                <div class="slide p-3! w-1/2 aspect-video  shrink-0  ">
                  <img src="./public/products/daniel-korpai-hbTKIbuMmBI-unsplash.jpg"
                    class=" select-none pointer-events-none w-full h-full object-cover rounded-lg " alt="">
                </div>
                <div class="slide p-3! w-1/2 aspect-video  shrink-0  ">
                  <img src="./public/products/david-svihovec-LEtrhrME07g-unsplash.jpg"
                    class=" select-none pointer-events-none w-full h-full object-cover rounded-lg " alt="">
                </div>

              </div>
              <div class="dotsContainer flex justify-center gap-3 mt-3  ">

                <div class="dot h-2 w-2 bg-gray-400 rounded-full cursor-pointer " data-idx="0" ></div>
                <div class="dot h-2 w-2 bg-gray-400 rounded-full cursor-pointer" data-idx="1"></div>
                <div class="dot h-2 w-2 bg-gray-400 rounded-full cursor-pointer" data-idx="2"></div>
                <div class="dot h-2 w-2 bg-gray-400 rounded-full cursor-pointer " data-idx="3"></div>
                <div class="dot h-2 w-2 bg-gray-400 rounded-full cursor-pointer " data-idx="4"></div>
              </div>
            </div>

            <div class="leftArrow absolute top-1/2 -translate-y-1/2 left-0 
            w-6 h-6 sm:w-8 sm:h-8 group
            border border-gray-400/85 rounded-full z-10 
            -translate-x-[80%] sm:-translate-x-[150%] 
            flex justify-center items-center cursor-pointer ">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-3 sm:size-4 group-hover:size-4 sm:group-hover:size-5 
         group-hover:-translate-x-0.5 transition duration-75 ease-in-out">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
              </svg>
            </div>


            <div class="rightArrow absolute top-1/2 -translate-y-1/2 right-0 
            w-6 h-6 sm:w-8 sm:h-8 group
            border border-gray-400/85 rounded-full z-10 
            translate-x-[80%] sm:translate-x-[150%] 
            flex justify-center items-center cursor-pointer ">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-3 sm:size-4 group-hover:size-4 sm:group-hover:size-5 
         group-hover:translate-x-0.5 transition duration-75 ease-in-out">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
              </svg>
            </div>


          </div>

          <div class="paymentApproatches p-3 grid grid-cols-1  sm:grid-cols-2 lg:grid-cols-4  gap-3 mt-6   ">
            <div class=" shadow-[0_4px_35px_rgba(0,0,0,0.25)] min-h-24 rounded-md px-3 py-2 flex  items-center gap-4">

                  <div> 
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-check "><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"></path><path d="m9 12 2 2 4-4"></path></svg>
                  </div>
                  <div>

                    <h3 class="text-lg font-semibold" > Secure Payments </h3>
                    <p class=" line-clamp-2" >For all orders above 1000$</p>
                  </div>
               
            </div>
            <div class=" shadow-[0_4px_35px_rgba(0,0,0,0.25)] min-h-24 rounded-md px-3 py-2 flex  items-center gap-4">

                  <div>  
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-message-circle-plus "><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path><path d="M8 12h8"></path><path d="M12 8v8"></path></svg>
                  </div>
                  <div class="" >

                    <h3 class="text-lg font-semibold" >Customer Care </h3>
                    <p class=" line-clamp-2" >All transactions are secured and encrypted</p>
                  </div>
               
            </div>
            <div class=" shadow-[0_4px_35px_rgba(0,0,0,0.25)] min-h-24 rounded-md px-3 py-2 flex  items-center gap-4 ">

                  <div>  
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trophy "><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>
                  </div>
                  <div>

                    <h3 class="text-lg font-semibold" > Best Prices </h3>
                    <p class=" line-clamp-2" >Get support 24/7 via phone or chat$</p>
                  </div>
               
            </div>
            <div class=" shadow-[0_4px_35px_rgba(0,0,0,0.25)] min-h-24 rounded-md px-3 py-2 flex  items-center gap-4">

                  <div>  
                    
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-truck "><path d="M5 18H3c-.6 0-1-.4-1-1V7c0-.6.4-1 1-1h10c.6 0 1 .4 1 1v11"></path><path d="M14 9h4l4 4v4c0 .6-.4 1-1 1h-2"></path><circle cx="7" cy="18" r="2"></circle><path d="M15 18H9"></path><circle cx="17" cy="18" r="2"></circle></svg>
                  </div>
                  <div>

                    <h3 class="text-lg font-semibold " > Free Shipping </h3>
                    <p class=" line-clamp-2" >We offer the best prices for our products</p>
                  </div>
               
            </div>


          </div>
        </div>
      </div>




    </div>





  </section>


 <script type="module" src="./dist/components/header.js"></script>
 <script type="module" src="./dist/components/categoriesBar.js"></script>
 <script type="module" src="./dist/components/drawer.js"></script>
 <script type="module" src="./dist/scripts/core/stateManager.js"></script>
 <script type="module" src="./dist/main.js"></script>
</body>

</html>
